name: Gerar instalador Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:evolucao:db
      - run: npm run test:auditoria:db
      - run: npm run test:provisionamento:db
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: servicos/leitor-placas/requirements.txt
      - run: python -m pip install -r servicos/leitor-placas/requirements.txt
      - run: python servicos/leitor-placas/teste_reconhecimento.py
      - run: npm run test:camera:db
      - run: npm run test:camera:edge
      - run: npm run compilar:leitor
      - run: python servicos/leitor-placas/verificar_executavel.py
      - run: npm run gerar:instalador
      - uses: actions/upload-artifact@v4
        with:
          name: PegaNaFrota-Instalador-Windows
          path: instaladores/*.exe
          if-no-files-found: error
