name: Verificar firmware ESP32-S3
on:
  workflow_dispatch:
  push:
    paths:
      - 'dispositivos/**'
      - '.github/workflows/verificar-camera.yml'
  pull_request:
    paths:
      - 'dispositivos/**'
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.4 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli lib install ArduinoJson@7.4.2
      - run: arduino-cli compile --fqbn 'esp32:esp32:esp32s3:PSRAM=opi,FlashSize=8M,PartitionScheme=huge_app,USBMode=hwcdc,CDCOnBoot=cdc' --output-dir artifacts/firmware dispositivos/esp32-s3/peganafrota-camera
      - uses: actions/upload-artifact@v4
        with:
          name: Firmware-ESP32-S3-fonte-configuravel
          path: artifacts/firmware/*
          if-no-files-found: error
